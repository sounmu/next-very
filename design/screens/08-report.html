<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390, initial-scale=1">
  <title>마진로그 · 10월 리포트</title>
  <link rel="stylesheet" href="../tokens.css">
  <style>
    /* 08 report: screen-scoped styles. Every value traces to tokens.css. */

    /* headline + trend */
    .hero .card-title { margin-bottom: var(--s-1); }
    .hero-row { display: flex; align-items: center; gap: var(--s-2); }
    .hero-value { font-size: var(--fs-display); font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; }
    .hero-value .unit { font-size: var(--fs-title); font-weight: 700; margin-left: 2px; }
    .trend { display: block; width: 100%; height: auto; margin-top: var(--s-1); }
    .trend text { font-family: var(--font); font-variant-numeric: tabular-nums; }
    .bar { fill: color-mix(in srgb, var(--c-primary) 18%, var(--c-surface)); }
    .bar.is-now { fill: var(--c-primary); }
    .base { stroke: var(--c-line); stroke-width: 1; }
    .line { fill: none; stroke: var(--c-primary); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: var(--c-surface); stroke: var(--c-primary); stroke-width: 2; }
    .dot.is-now { fill: var(--c-primary); stroke: var(--c-surface); }
    .val { font-size: var(--fs-xs); font-weight: 600; fill: var(--c-text-2); }
    .val.is-now { font-size: var(--fs-sm); font-weight: 800; fill: var(--c-primary); }
    .axis { font-size: var(--fs-xs); font-weight: 600; fill: var(--c-text-2); }
    .axis.is-now { fill: var(--c-primary); font-weight: 800; }

    /* KPI row */
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); padding: var(--s-3); }
    .kpi { display: flex; flex-direction: column; gap: var(--s-1); padding: 0 var(--s-2); }
    .kpi + .kpi { border-left: 1px solid var(--c-line); }
    .kpi .label { font-size: var(--fs-sm); color: var(--c-text-2); font-weight: 600; }
    .kpi .value { font-size: var(--fs-body); font-weight: 700; white-space: nowrap; }
    .kpi .value small { font-size: var(--fs-sm); font-weight: 600; margin-left: 1px; }
    .kpi .value.is-good { color: var(--c-profit); }

    /* cost composition */
    .mix-total { font-size: var(--fs-sm); font-weight: 600; color: var(--c-text-3); margin-left: var(--s-1); }
    .menu-link { display: inline-flex; align-items: center; }
    .mix { display: flex; align-items: center; gap: var(--s-5); margin-top: var(--s-3); }
    .donut { width: 104px; height: 104px; flex: none; }
    .seg { fill: none; stroke-width: 14; }
    .legend { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--s-1); }
    .lg { display: flex; align-items: center; gap: var(--s-2); font-size: var(--fs-sm); line-height: 18px; }
    .lg i { width: 8px; height: 8px; border-radius: var(--r-full); flex: none; }
    .lg .name { flex: 1; color: var(--c-text-2); font-weight: 500; }
    .lg .pct { font-weight: 700; font-variant-numeric: tabular-nums; }
    .c1 { stroke: var(--chart-1); background: var(--chart-1); }
    .c2 { stroke: var(--chart-2); background: var(--chart-2); }
    .c3 { stroke: var(--chart-3); background: var(--chart-3); }
    .c4 { stroke: var(--chart-4); background: var(--chart-4); }
    .c5 { stroke: var(--chart-5); background: var(--chart-5); }

    /* insight */
    .insight { background: var(--c-accent-50); box-shadow: none; display: flex; flex-direction: column; gap: var(--s-2); }
    .insight .eyebrow { display: flex; align-items: center; gap: var(--s-1); font-size: var(--fs-sm); font-weight: 700; color: var(--c-warn); }
    .insight p { font-size: var(--fs-body); font-weight: 500; line-height: 1.5; word-break: keep-all; }
    .insight b { font-weight: 700; }
    .link-btn { position: relative; align-self: flex-start; display: inline-flex; align-items: center; gap: 2px; height: 24px; font-size: var(--fs-sm); font-weight: 700; color: var(--c-primary); text-decoration: none; }
    .link-btn::after { content: ""; position: absolute; inset: -10px -8px; }
    .tab { text-decoration: none; }
  </style>
</head>
