<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>마진로그 - 03 사진 업로드</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  /* 카메라 화면 전용 다크 토큰. tokens.css에는 어두운 표면 토큰이 없어 이 화면 범위에서만 확장한다. */
  .frame.is-camera {
    --cam-bg-1: #373D45;
    --cam-bg-2: #1B2025;
    --cam-bg-3: #0B0E11;
    --cam-fg: #FFFFFF;
    --cam-fg-2: rgba(255, 255, 255, .72);
    --cam-scrim: rgba(0, 0, 0, .46);
    --cam-glass: rgba(255, 255, 255, .16);
    --cam-glass-line: rgba(255, 255, 255, .34);
    --cam-bar: rgba(8, 10, 13, .78);
    --cam-shadow: 0 14px 30px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .35);
    --paper: #F4F2EC;
    --paper-ink: #CDC9C0;
    --paper-ink-2: #8E8A81;
    --paper-line: #DAD6CD;
    --thumb-1: #5E6D7E;
    --thumb-2: #2B343D;
    background: radial-gradient(120% 85% at 50% 40%, var(--cam-bg-1) 0%, var(--cam-bg-2) 50%, var(--cam-bg-3) 100%);
    color: var(--cam-fg);
  }

  /* 상단바/하단 컨트롤은 스크림 위에 올린다 */
  .is-camera .statusbar,
  .is-camera .appbar,
  .is-camera .controls { position: relative; z-index: 1; }
  .is-camera .appbar h1 { text-align: center; color: var(--cam-fg); }
  .is-camera .icon-btn { color: var(--cam-fg); }
  .appbar .spacer { width: 40px; height: 40px; flex: none; }

  /* 뷰파인더 영역 */
  .is-camera .content {
    overflow: visible;
    padding: 28px var(--s-4) 0;
    gap: var(--s-5);
    align-items: center;
    justify-content: flex-start;
  }
  .stage {
    position: relative;
    width: 286px;
    height: 400px;
    flex: none;
    border-radius: var(--r-md);
    box-shadow: 0 0 0 999px var(--cam-scrim);
    display: grid;
    place-items: center;
  }
  .corner {
    position: absolute;
    width: 32px;
    height: 32px;
    border: 3px solid var(--cam-fg);
  }
  .corner.tl { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: var(--r-md); }
  .corner.tr { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: var(--r-md); }
  .corner.bl { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: var(--r-md); }
  .corner.br { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: var(--r-md); }

  /* 틀 안의 거래명세서 모형 */
  .paper {
    width: 236px;
    height: 336px;
    padding: 22px 18px;
    background: var(--paper);
    border-radius: 3px;
    box-shadow: var(--cam-shadow);
    transform: rotate(-2.5deg);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .paper .ttl { width: 104px; height: 9px; margin: 0 auto var(--s-1); border-radius: 4px; background: var(--paper-ink-2); }
  .paper .rule { height: 1px; background: var(--paper-line); }
  .paper .r { display: flex; align-items: center; gap: 10px; }
  .paper .r.between { justify-content: space-between; }
  .ln { height: 6px; border-radius: 3px; background: var(--paper-ink); }
  .ln.dark { background: var(--paper-ink-2); }
  .ln.w1 { width: 72px; }
  .ln.w2 { width: 44px; }
  .ln.a { flex: 1; }
  .ln.b { width: 26px; }
  .ln.c { width: 44px; }
  .ln.total { height: 8px; border-radius: 4px; background: var(--paper-ink-2); }
  .ln.total.l { width: 48px; }
  .ln.total.v { width: 64px; }

  .hint {
    font-size: var(--fs-body);
    font-weight: 600;
    color: var(--cam-fg);
    text-align: center;
    letter-spacing: -.01em;
  }
  .tips { display: flex; gap: var(--s-2); }
  .tip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 var(--s-3) 0 10px;
    border-radius: var(--r-full);
    background: var(--cam-glass);
    color: var(--cam-fg);
    font-size: var(--fs-sm);
    font-weight: 600;
  }
  .tip svg { width: 16px; height: 16px; flex: none; }

  /* 하단 컨트롤 */
  .controls {
    flex: none;
    height: 150px;
    padding: var(--s-5) var(--s-8) 34px;
    background: var(--cam-bar);
    display: grid;
    grid-template-columns: 1fr 80px 1fr;
    align-items: center;
  }
  .side {
    justify-self: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    border: 0;
    background: none;
    color: var(--cam-fg-2);
    font: 600 var(--fs-xs) var(--font);
  }
  .thumb {
    position: relative;
    width: 52px;
    height: 52px;
    border-radius: var(--r-md);
    border: 2px solid var(--cam-glass-line);
    overflow: hidden;
    background: linear-gradient(150deg, var(--thumb-1) 0%, var(--thumb-2) 100%);
  }
  .thumb::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 22px;
    height: 28px;
    margin: -14px 0 0 -11px;
    border-radius: 2px;
    background: var(--paper);
    transform: rotate(8deg);
    opacity: .92;
  }
  .round {
    width: 52px;
    height: 52px;
    border-radius: var(--r-full);
    background: var(--cam-glass);
    color: var(--cam-fg);
    display: grid;
    place-items: center;
  }
  .shutter {
    width: 80px;
    height: 80px;
    padding: 4px;
    border-radius: var(--r-full);
    border: 3px solid var(--cam-fg);
    background: transparent;
    display: block;
  }
  .shutter span { display: block; width: 100%; height: 100%; border-radius: var(--r-full); background: var(--cam-fg); }

  .is-camera .home-indicator { background: var(--cam-fg); z-index: 2; }
</style>
</head>
<body>
<main class="frame is-camera">
  <div class="statusbar">
    <span class="num">9:41</span>
    <span class="sb-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="7.5" width="3" height="4.5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M1.5 4.3a9.4 9.4 0 0 1 13 0"/><path d="M4.3 7.3a5.4 5.4 0 0 1 7.4 0"/><circle cx="8" cy="10.3" r="1.1" fill="currentColor" stroke="none"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none" aria-hidden="true"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="currentColor" stroke-opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/><path d="M25 4.3v4.4a2.2 2.2 0 0 0 0-4.4Z" fill="currentColor" fill-opacity=".4"/></svg>
    </span>
  </div>

  <div class="appbar">
    <button class="icon-btn" type="button" aria-label="닫기">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <h1>거래명세서 촬영</h1>
    <span class="spacer" aria-hidden="true"></span>
  </div>

  <section class="content">
    <div class="stage" role="img" aria-label="카메라 미리보기. 틀 안에 거래명세서가 비스듬히 놓여 있음">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>
      <div class="paper" aria-hidden="true">
        <div class="ttl"></div>
        <div class="r between"><span class="ln w1"></span><span class="ln w2"></span></div>
        <div class="rule"></div>
        <div class="r"><span class="ln dark a"></span><span class="ln dark b"></span><span class="ln dark c"></span></div>
        <div class="r"><span class="ln a"></span><span class="ln b"></span><span class="ln c"></span></div>
        <div class="r"><span class="ln a"></span><span class="ln b"></span><span class="ln c"></span></div>
        <div class="r"><span class="ln a"></span><span class="ln b"></span><span class="ln c"></span></div>
        <div class="r"><span class="ln a"></span><span class="ln b"></span><span class="ln c"></span></div>
        <div class="r"><span class="ln a"></span><span class="ln b"></span><span class="ln c"></span></div>
        <div class="r"><span class="ln a"></span><span class="ln b"></span><span class="ln c"></span></div>
        <div class="r"><span class="ln a"></span><span class="ln b"></span><span class="ln c"></span></div>
        <div class="rule"></div>
        <div class="r between"><span class="ln total l"></span><span class="ln total v"></span></div>
      </div>
    </div>

    <p class="hint">거래명세서가 틀 안에 들어오게 맞춰주세요</p>

    <div class="tips">
      <span class="tip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        밝은 곳에서
      </span>
      <span class="tip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16" stroke-dasharray="2.5 2.5"/><path d="M8 8l-4 4 4 4M4 12h5"/><path d="M16 8l4 4-4 4M20 12h-5"/></svg>
        접힌 곳 펴기
      </span>
    </div>
  </section>

  <div class="controls">
    <button class="side" type="button" aria-label="갤러리에서 사진 선택">
      <span class="thumb" aria-hidden="true"></span>
      갤러리
    </button>
    <button class="shutter" type="button" aria-label="촬영"><span></span></button>
    <button class="side" type="button" aria-label="플래시 켜기" aria-pressed="false">
      <span class="round" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3 5 13.5h6l-1 7.5 8-10.5h-6l1-7.5Z"/><path d="M3 3l18 18"/></svg>
      </span>
      플래시 꺼짐
    </button>
  </div>

  <div class="home-indicator"></div>
</main>
</body>
</html>
